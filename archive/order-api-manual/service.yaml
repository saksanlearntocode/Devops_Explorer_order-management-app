apiVersion: v1
kind: Service
metadata:
  name: order-api-clusterip
  namespace: order-system
spec:
  selector:
    app: order-api
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: order-api-nodeport
  namespace: order-system
spec:
  type: NodePort
  selector:
    app: order-api
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
