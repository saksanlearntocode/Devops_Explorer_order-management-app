apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/saksanlearntocode/Devops_Explorer_order-management-app.git
    targetRevision: main
    path: cluster1/order-api/helm/order-api

  destination:
    server: https://kubernetes.default.svc
    namespace: order-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
