apiVersion: v1
kind: ConfigMap
metadata:
  name: order-processor
  namespace: order-system
data:
  processor.py: |
    from pymongo import MongoClient
    import os

    host = os.getenv("MONGO_HOST", "mongodb-svc")
    port = int(os.getenv("MONGO_PORT", "27017"))
    db_name = os.getenv("MONGO_DB", "ordersdb")

    client = MongoClient(f"mongodb://{host}:{port}/")
    db = client[db_name]

    orders = db.orders.find({"status": "pending"})
    count = 0

    for order in orders:
        print(f"Processing order: {order['id']}")

        db.orders.update_one(
            {"_id": order["_id"]},
            {"$set": {"status": "processed"}}
        )

        count += 1

    print(f"Processed {count} orders")

---
apiVersion: batch/v1
kind: Job
metadata:
  name: order-processing-job
  namespace: order-system
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never

      containers:
      - name: processor
        image: python:3.11-slim

        command:
        - /bin/sh
        - -c
        - |
          pip install pymongo --quiet
          python /app/processor.py

        envFrom:
        - configMapRef:
            name: order-api-config
        - secretRef:
            name: order-api-secret

        volumeMounts:
        - name: processor-code
          mountPath: /app

      volumes:
      - name: processor-code
        configMap:
          name: order-processor