apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: order-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: order-system
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: order-system
subjects:
- kind: ServiceAccount
  name: jenkins-deployer
  namespace: order-system
roleRef:
  kind: Role
  name: jenkins-deployer-role
  apiGroup: rbac.authorization.k8s.io
