apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-reader
  namespace: order-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: order-reader-role
  namespace: order-system
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: order-reader-binding
  namespace: order-system
subjects:
- kind: ServiceAccount
  name: order-reader
  namespace: order-system
roleRef:
  kind: Role
  name: order-reader-role
  apiGroup: rbac.authorization.k8s.io